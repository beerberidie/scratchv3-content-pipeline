<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scratch Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    /* Fallback CSS Variables (in case theme.css doesn't load) */
    :root {
      /* Light theme defaults */
      --bg-primary: #f9fafb;
      --bg-secondary: #f3f4f6;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --card-bg: #ffffff;
      --border-primary: #e5e7eb;
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --input-border-focus: #3b82f6;
      --input-text: #111827;
      --input-placeholder: #9ca3af;
      --btn-primary-bg: #3b82f6;
      --btn-primary-bg-hover: #2563eb;
      --btn-primary-text: #ffffff;
      --btn-primary-border: #3b82f6;
      --nav-bg: #ffffff;
      --nav-border: #e5e7eb;
      --nav-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --primary-50: #eff6ff;
      --secondary-50: #fffbeb;
      --transition-fast: 0.15s ease-in-out;
      --space-2: 0.5rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      --font-size-base: 1rem;
      --font-size-sm: 0.875rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 1.875rem;
      --font-weight-medium: 500;
      --font-weight-bold: 700;
      --radius-xl: 1rem;
      --input-padding-y: 0.75rem;
      --input-padding-x: 1rem;
      --card-radius: 1rem;
      --card-border: #e5e7eb;
    }

    /* Dark theme overrides */
    [data-theme="dark"] {
      --bg-primary: #111827;
      --bg-secondary: #1f2937;
      --text-primary: #f3f4f6;
      --text-secondary: #d1d5db;
      --card-bg: #1f2937;
      --border-primary: #374151;
      --input-bg: #1f2937;
      --input-border: #4b5563;
      --input-border-focus: #3b82f6;
      --input-text: #f3f4f6;
      --input-placeholder: #9ca3af;
      --btn-primary-bg: #3b82f6;
      --btn-primary-bg-hover: #2563eb;
      --btn-primary-text: #ffffff;
      --btn-primary-border: #3b82f6;
      --nav-bg: #1f2937;
      --nav-border: #374151;
      --nav-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --card-border: #374151;
    }

    /* Auto dark mode (system preference) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #111827;
        --bg-secondary: #1f2937;
        --text-primary: #f3f4f6;
        --text-secondary: #d1d5db;
        --card-bg: #1f2937;
        --border-primary: #374151;
        --input-bg: #1f2937;
        --input-border: #4b5563;
        --input-border-focus: #3b82f6;
        --input-text: #f3f4f6;
        --input-placeholder: #9ca3af;
        --nav-bg: #1f2937;
        --nav-border: #374151;
        --nav-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        --card-border: #374151;
      }
    }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    /* Light mode gradient background */
    :root:not([data-theme="dark"]) body {
      background: linear-gradient(135deg, var(--primary-50) 0%, var(--secondary-50) 100%);
    }

    /* Auto light mode gradient background */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) body {
        background: linear-gradient(135deg, var(--primary-50) 0%, var(--secondary-50) 100%);
      }
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--nav-bg);
      color: var(--text-primary);
      padding: var(--space-4) var(--space-6);
      box-shadow: var(--nav-shadow);
      border-bottom: 1px solid var(--nav-border);
    }

    .header-center {
      display: flex;
      justify-content: center;
    }

    .logo {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      color: var(--primary-600);
      text-decoration: none;
    }

    .logo span {
      color: var(--secondary-500);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--space-8);
    }

    .login-container {
      width: 100%;
      max-width: 480px;
    }

    .login-box {
      background: var(--card-bg);
      padding: var(--space-8);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
    }

    .login-box h2 {
      margin: 0 0 var(--space-6) 0;
      color: var(--text-primary);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      text-align: center;
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: var(--space-8);
      font-size: var(--font-size-base);
    }

    .form-group {
      margin-bottom: var(--space-5);
    }

    label {
      display: block;
      margin-bottom: var(--space-2);
      font-weight: var(--font-weight-medium);
      color: var(--text-primary);
      font-size: var(--font-size-sm);
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: var(--input-padding-y) var(--input-padding-x);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-xl);
      font-size: var(--font-size-base);
      background: var(--input-bg);
      color: var(--input-text);
      transition: all var(--transition-fast);
      box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      outline: none;
      border-color: var(--input-border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    input::placeholder {
      color: var(--input-placeholder);
    }

    .remember-me {
      display: flex;
      align-items: center;
      margin-bottom: var(--space-6);
      gap: var(--space-2);
    }

    .remember-me input[type="checkbox"] {
      width: auto;
      margin: 0;
    }

    .remember-me label {
      margin: 0;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }

    .btn {
      width: 100%;
      padding: var(--btn-padding-y) var(--btn-padding-x);
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border: 1px solid var(--btn-primary-border);
      border-radius: var(--radius-xl);
      cursor: pointer;
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-medium);
      transition: all var(--transition-fast);
      box-sizing: border-box;
    }

    .btn:hover:not(:disabled) {
      background: var(--btn-primary-bg-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .test-accounts {
      margin-top: var(--space-6);
      padding: var(--space-4);
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-primary);
    }

    .test-accounts h4 {
      margin: 0 0 var(--space-3) 0;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
    }

    .test-account-selector {
      margin-bottom: var(--space-3);
    }

    .test-account-selector select {
      font-size: var(--font-size-sm);
      padding: var(--space-2) var(--space-3);
    }

    .test-accounts-list {
      font-size: var(--font-size-xs);
      color: var(--text-secondary);
      line-height: var(--line-height-relaxed);
    }

    .test-accounts-list strong {
      color: var(--text-primary);
    }

    /* Theme toggle button styles */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-2) var(--space-4);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-size: var(--font-size-sm);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--card-bg);
    }

    .theme-toggle:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-color: var(--border-primary);
    }

    .theme-toggle:focus {
      outline: none;
      border-color: var(--input-border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .theme-icon {
      font-size: 1rem;
      line-height: 1;
    }

    /* === DARK MODE SPECIFIC OVERRIDES === */

    /* Dark mode body background */
    [data-theme="dark"] body {
      background: var(--bg-primary) !important;
    }

    /* Auto dark mode (system preference) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) body {
        background: var(--bg-primary) !important;
      }
    }

    /* Dark mode login box */
    [data-theme="dark"] .login-box {
      background: var(--card-bg);
      border-color: var(--border-primary);
      box-shadow: var(--shadow-2xl);
    }

    /* Auto dark mode login box */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .login-box {
        background: var(--card-bg);
        border-color: var(--border-primary);
        box-shadow: var(--shadow-2xl);
      }
    }

    /* Dark mode form elements */
    [data-theme="dark"] input[type="text"],
    [data-theme="dark"] input[type="password"] {
      background: var(--input-bg);
      border-color: var(--input-border);
      color: var(--input-text);
    }

    [data-theme="dark"] input[type="text"]:focus,
    [data-theme="dark"] input[type="password"]:focus {
      border-color: var(--input-border-focus);
    }

    /* Auto dark mode form elements */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) input[type="text"],
      :root:not([data-theme="light"]) input[type="password"] {
        background: var(--input-bg);
        border-color: var(--input-border);
        color: var(--input-text);
      }

      :root:not([data-theme="light"]) input[type="text"]:focus,
      :root:not([data-theme="light"]) input[type="password"]:focus {
        border-color: var(--input-border-focus);
      }
    }

    /* Dark mode button */
    [data-theme="dark"] .login-btn {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border-color: var(--btn-primary-border);
    }

    [data-theme="dark"] .login-btn:hover {
      background: var(--btn-primary-bg-hover);
    }

    /* Auto dark mode button */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .login-btn {
        background: var(--btn-primary-bg);
        color: var(--btn-primary-text);
        border-color: var(--btn-primary-border);
      }

      :root:not([data-theme="light"]) .login-btn:hover {
        background: var(--btn-primary-bg-hover);
      }
    }
  </style>
  <script src="/static/js/utils.js"></script>
</head>
<body>
  <header>
    <div></div>
    <div class="header-center">
      <div class="logo">Scratch<span>;</span></div>
    </div>
    <div style="display: flex; justify-content: flex-end;">
      <!-- Theme toggle removed - dark mode only -->
    </div>
  </header>

  <main>
    <div class="login-container">
      <div class="login-box">
        <h2>Welcome Back</h2>
        <p class="login-subtitle">Sign in to your Scratch account</p>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>
          <div class="remember-me">
            <input type="checkbox" id="rememberMe" />
            <label for="rememberMe">Remember me for 30 days</label>
          </div>
          <button class="btn" type="submit">Sign In</button>
        </form>

        <div class="test-accounts" id="testAccounts" style="display: none;">
          <h4><span class="icon icon-settings"></span> Test Accounts (Development Only)</h4>
          <div class="test-account-selector">
            <label for="testAccountSelect">Quick Login:</label>
            <select id="testAccountSelect" onchange="selectTestAccount()">
              <option value="">Select a test account...</option>
              <option value="admin:admin123">Admin User (admin / admin123)</option>
              <option value="demo:demo123">Demo User (demo / demo123)</option>
              <option value="test:test123">Test User (test / test123)</option>
            </select>
          </div>
          <div class="test-accounts-list">
            <strong>Available test accounts:</strong><br>
            • <strong>admin</strong> / admin123 - Full admin access<br>
            • <strong>demo</strong> / demo123 - Demo user with sample data<br>
            • <strong>test</strong> / test123 - Basic test user
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const rememberMe = document.getElementById("rememberMe").checked;

      try {
        // Show loading state
        const submitBtn = event.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Logging in...';
        submitBtn.disabled = true;

        // Make login request
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username: username,
            password: password,
            remember_me: rememberMe
          })
        });

        if (response.ok) {
          const data = await response.json();

          // Store token and user info
          localStorage.setItem('scratch_token', data.access_token);
          localStorage.setItem('scratch_user', JSON.stringify({
            username: data.username,
            email: data.email,
            user_id: data.user_id
          }));

          // Store username if remember me is checked
          if (rememberMe) {
            localStorage.setItem("scratch_username", username);
          } else {
            localStorage.removeItem("scratch_username");
          }

          // Redirect to dashboard
          window.location.href = '/dashboard';
        } else {
          const error = await response.json();
          alert(`Login failed: ${error.detail || 'Invalid credentials'}`);
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Login failed: Network error. Please try again.');
      } finally {
        // Restore button state
        const submitBtn = event.target.querySelector('button[type="submit"]');
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    }

    function selectTestAccount() {
      const select = document.getElementById('testAccountSelect');
      const value = select.value;

      if (value) {
        const [username, password] = value.split(':');
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;

        // Focus the login button
        document.querySelector('.btn[type="submit"]').focus();
      }
    }

    function checkDebugMode() {
      // Show test accounts in development/debug mode
      // You can check for localhost, debug flag, or environment variable
      const isDebug = window.location.hostname === 'localhost' ||
                     window.location.hostname === '127.0.0.1' ||
                     window.location.search.includes('debug=true');

      if (isDebug) {
        document.getElementById('testAccounts').style.display = 'block';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Check if already logged in
      const token = localStorage.getItem('scratch_token');
      if (token) {
        // Verify token is still valid
        fetch('/api/auth/me', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        }).then(response => {
          if (response.ok) {
            // Already logged in, redirect to dashboard
            window.location.href = '/dashboard';
          } else {
            // Token invalid, clear storage
            localStorage.removeItem('scratch_token');
            localStorage.removeItem('scratch_user');
          }
        }).catch(() => {
          // Network error, clear storage to be safe
          localStorage.removeItem('scratch_token');
          localStorage.removeItem('scratch_user');
        });
      }

      // Pre-fill username if saved
      const savedUser = localStorage.getItem("scratch_username");
      if (savedUser) {
        document.getElementById("username").value = savedUser;
        document.getElementById("rememberMe").checked = true;
      }

      // Check if we should show debug/test accounts
      checkDebugMode();

      // Add keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        // Alt + T to toggle test accounts
        if (e.altKey && e.key === 't') {
          e.preventDefault();
          const testAccounts = document.getElementById('testAccounts');
          testAccounts.style.display = testAccounts.style.display === 'none' ? 'block' : 'none';
        }
      });
    });

    // Inline Theme Manager (fallback if utils.js doesn't load) - Dark mode only
    if (typeof themeManager === 'undefined') {
      window.themeManager = {
        getCurrentTheme() {
          return 'dark';
        },

        setTheme(theme) {
          localStorage.setItem('theme', 'dark');
          this.applyTheme('dark');
        },

        applyTheme(theme) {
          const html = document.documentElement;
          html.setAttribute('data-theme', 'dark');
        },

        toggleTheme() {
          // Do nothing - dark mode only
          return;
        },

        updateThemeToggle() {
          // Hide theme toggle
          const toggleBtn = document.querySelector('.theme-toggle');
          if (toggleBtn) {
            toggleBtn.style.display = 'none';
          }
        },

        init() {
          // Always apply dark theme
          this.applyTheme('dark');
          localStorage.setItem('theme', 'dark');
          this.updateThemeToggle();
        }
      };

      // Initialize theme system
      themeManager.init();
    }
  </script>
</body>
</html>
